<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intermarché Drive — démo profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e2001a;
    --red-2: #c40016;
    --red-soft: #fde6e8;
    --ink: #1d1d1b;
    --muted: #6d6d72;
    --line: #e4e4e8;
    --bg: #f3f3f5;
    --card: #ffffff;
    --green: #1f8f3a;
    --green-2: #157a2e;
    --yellow: #ffe94a;
    --purple: #ece4fb;
    --purple-ink: #4b2a9a;
    --warn: #b65400;
    --warn-bg: #fff3e4;
    --warn-line: #f7c58e;
    --ok: #1f8f3a;
    --ok-bg: #e5f5ea;
    --sea: #0b4f8a;
    --sea-2: #1672b8;
    --sun: #f6b73c;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 "Barlow", "Segoe UI", Arial, sans-serif; padding-bottom: 96px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }
  h1, h2, h3, .cond { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .1px; }
  h1 { font-size: 40px; margin: 0; font-weight: 700; }
  h2 { font-size: 30px; margin: 0; font-weight: 700; }
  h3 { font-size: 22px; margin: 0; font-weight: 700; }
  .wrap { max-width: 1480px; margin: 0 auto; padding: 0 40px; }
  .muted { color: var(--muted); }

  /* ---------- En-tête ---------- */
  .hdr { position: sticky; top: 0; z-index: 40; background: #fff; height: 92px; display: flex; align-items: center; gap: 6px; padding: 0 40px; box-shadow: 0 1px 0 var(--line); }
  .logo { display: flex; flex-direction: column; line-height: .82; cursor: pointer; margin-right: 18px; user-select: none; }
  .logo .l1 { font: italic 800 38px/0.85 "Barlow Condensed", sans-serif; color: var(--ink); letter-spacing: -1px; }
  .logo .l2 { font: italic 800 22px/0.9 "Barlow Condensed", sans-serif; color: var(--red); padding-left: 2px; }
  .nav { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 12px; border: 0; background: none; font-size: 14px; font-weight: 500; border-radius: 10px; min-width: 80px; position: relative; }
  .nav:hover { background: var(--bg); }
  .nav svg { width: 26px; height: 26px; }
  .nav .promo-ic { width: 26px; height: 26px; border-radius: 6px; background: var(--yellow); display: grid; place-items: center; font-weight: 800; font-size: 14px; border: 1.5px solid var(--ink); }
  .nav .pill-new { position: absolute; top: 0; right: 6px; background: var(--red); color: #fff; font-size: 9px; font-weight: 700; border-radius: 6px; padding: 1px 4px; }
  .nav.on { color: var(--red); }
  .nav .count[hidden] { display: none; }
  .nav .count { position: absolute; top: 0; right: 16px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; border-radius: 10px; min-width: 19px; height: 19px; display: grid; place-items: center; padding: 0 4px; }
  .search { flex: 1; display: flex; align-items: center; gap: 10px; background: var(--bg); border: 2px solid var(--line); border-radius: 30px; height: 58px; padding: 4px; margin: 0 18px; }
  .search.on { border-color: var(--ink); background: #fff; }
  .search .rayons { display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 16px; border: 0; border-radius: 24px; background: #fff; font-weight: 700; font-size: 17px; }
  .search .rayons.on { background: var(--red-soft); color: var(--red); }
  .search input { flex: 1; border: 0; background: transparent; font: inherit; font-size: 18px; outline: none; }
  .search .go { border: 0; background: none; padding: 0 12px; }
  .search svg { width: 24px; height: 24px; }

  /* ---------- Bandeaux ---------- */
  .freeship { background: var(--bg); text-align: center; padding: 12px 0 10px; color: var(--red); font: italic 600 19px/1 "Barlow", sans-serif; text-transform: uppercase; letter-spacing: .3px; }
  .freeship sup { font-size: 11px; }
  .storebar { background: linear-gradient(90deg, var(--sea), var(--sea-2)); color: #fff; }
  .storebar .wrap { display: flex; align-items: center; gap: 18px; height: 54px; }
  .storebar .who { display: flex; align-items: center; gap: 10px; font-weight: 700; white-space: nowrap; padding-right: 18px; border-right: 1px solid rgba(255,255,255,.3); }
  .storebar .who .dot { width: 30px; height: 30px; border-radius: 50%; background: var(--sun); color: var(--sea); display: grid; place-items: center; font-size: 16px; }
  .storebar .who small { display: block; font-weight: 500; opacity: .8; font-size: 12px; }
  .storebar .msg { flex: 1; display: flex; align-items: center; gap: 10px; font-size: 16px; transition: opacity .35s; min-width: 0; }
  .storebar .msg .ic { font-size: 20px; }
  .storebar .msg b { font-weight: 700; }
  .storebar .msg.fade { opacity: 0; }
  .storebar .dots { display: flex; gap: 6px; }
  .storebar .dots button { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 0; background: rgba(255,255,255,.4); }
  .storebar .dots button.on { background: #fff; }
  .insta { display: inline-flex; align-items: center; gap: 8px; background: #fff; color: var(--ink); border-radius: 20px; padding: 7px 14px 7px 8px; font-weight: 700; font-size: 14px; text-decoration: none; white-space: nowrap; border: 0; }
  .insta .ig { width: 24px; height: 24px; border-radius: 7px; background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%); display: grid; place-items: center; }
  .insta .ig svg { width: 15px; height: 15px; }

  /* ---------- Mise en page générale ---------- */
  main { padding-top: 22px; min-height: 60vh; }
  .panel { background: var(--card); border-radius: var(--radius); padding: 24px 28px; }
  .sec { margin-top: 34px; }
  .sec-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .sec-h p { margin: 4px 0 0; color: var(--muted); }
  .link { color: var(--red); background: none; border: 0; font-weight: 600; padding: 0; }
  .link:hover { text-decoration: underline; }
  .btn { border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; gap: 10px; justify-content: center; }
  .btn.red { background: var(--red); color: #fff; }
  .btn.red:hover { background: var(--red-2); }
  .btn.ghost { background: #fff; border: 1.5px solid var(--ink); }
  .btn.soft { background: var(--bg); }
  .btn.green { background: var(--green); color: #fff; }
  .btn.sm { padding: 8px 14px; font-size: 14px; border-radius: 10px; }
  .btn svg { width: 20px; height: 20px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 14px; font-weight: 500; font-size: 15px; }
  .chip.on { border-color: var(--red); color: var(--red); background: #fff; font-weight: 600; }
  .tag { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; background: var(--bg); color: var(--ink); white-space: nowrap; }
  .tag.loc { background: #e3f0fb; color: var(--sea); }
  .tag.bio { background: var(--ok-bg); color: var(--green-2); }
  .tag.new { background: var(--red-soft); color: var(--red); }
  .tag.mdd { background: #fff4c7; color: #7a5b00; }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .tag.ok { background: var(--ok-bg); color: var(--green-2); }

  /* ---------- Accueil ---------- */
  .hello { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }
  .hello h2 { font-size: 30px; }
  .hello .prof { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .hello .prof .lbl { font-weight: 600; margin-right: 4px; }
  .fid { text-align: right; display: flex; align-items: center; gap: 16px; cursor: pointer; }
  .fid .t { color: var(--green); font-weight: 700; font-size: 17px; }
  .fid .d { color: var(--muted); font-size: 14px; }
  .fid .v { color: var(--green); font: 700 40px/1 "Barlow Condensed", sans-serif; }
  .pa-banner { margin-top: 26px; background: var(--red); color: #fff; border-radius: 12px; text-align: center; padding: 18px; font: 800 44px/1 "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .5px; }
  .nice-sec { margin-top: 34px; border-radius: 22px; background: linear-gradient(180deg, #e6f1fa 0%, #f6fbff 100%); padding: 26px 28px 30px; position: relative; overflow: hidden; }
  .nice-sec::after { content: ""; position: absolute; right: -60px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(246,183,60,.55), rgba(246,183,60,0) 70%); pointer-events: none; }
  .nice-sec h2 { color: var(--sea); }
  .nice-sec .eyebrow { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; color: var(--sea); background: #fff; border-radius: 20px; padding: 4px 12px; font-size: 13px; margin-bottom: 8px; }
  .tabs { display: flex; gap: 10px; margin: 14px 0 16px; flex-wrap: wrap; }

  /* ---------- Cartes produit ---------- */
  .car { position: relative; }
  .crow { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 4 * 16px) / 5); gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 2px; }
  .crow::-webkit-scrollbar { display: none; }
  .crow > * { scroll-snap-align: start; }
  .cnav { position: absolute; top: -58px; width: 46px; height: 46px; border-radius: 50%; border: 0; background: #f08d97; color: #fff; font-size: 26px; line-height: 1; display: grid; place-items: center; }
  .cnav:hover { background: var(--red); }
  .cnav.l { right: 56px; } .cnav.r { right: 0; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .pcard { background: var(--card); border-radius: var(--radius); padding: 14px 16px 16px; display: flex; flex-direction: column; cursor: pointer; position: relative; transition: box-shadow .15s; min-width: 0; }
  .pcard:hover { box-shadow: 0 4px 18px rgba(0,0,0,.08); }
  .ptop { display: flex; align-items: center; gap: 6px; min-height: 32px; flex-wrap: wrap; padding-right: 34px; }
  .badge { border-radius: 20px; padding: 4px 11px; font-weight: 700; font-size: 13px; }
  .badge.pp { background: var(--purple); color: var(--purple-ink); }
  .badge.qp { background: #d0157a; color: #fff; }
  .badge.loc { background: var(--sea); color: #fff; }
  .badge.new { background: var(--red); color: #fff; }
  .badge.bio { background: var(--green); color: #fff; }
  .fav { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border: 0; background: none; display: grid; place-items: center; padding: 0; }
  .fav svg { width: 26px; height: 26px; }
  .fav.on svg { fill: var(--red); stroke: var(--red); }
  .pimg { height: 150px; border-radius: 12px; display: grid; place-items: center; font-size: 76px; margin: 8px 0 12px; position: relative; }
  .pimg .remise { position: absolute; right: 8px; bottom: 8px; width: 74px; height: 74px; border-radius: 50%; background: var(--yellow); color: var(--red); display: grid; place-items: center; text-align: center; font: 800 20px/0.9 "Barlow Condensed", sans-serif; }
  .pimg .remise small { display: block; color: var(--ink); font-size: 9px; }
  .why { font-size: 12px; font-weight: 600; color: var(--sea); margin: -4px 0 6px; display: flex; gap: 4px; align-items: center; }
  .pbrand { font-weight: 700; font-size: 15px; line-height: 1.2; }
  .pname { font-size: 15px; line-height: 1.25; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .punit { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .rwarn { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--warn); }
  .pbot { margin-top: auto; padding-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .price { font: 700 28px/1 "Barlow Condensed", sans-serif; }
  .addbtn { width: 50px; height: 50px; border-radius: 50%; border: 0; background: var(--red); color: #fff; display: grid; place-items: center; flex: none; }
  .addbtn:hover { background: var(--red-2); }
  .addbtn svg { width: 24px; height: 24px; }
  .step { display: inline-flex; align-items: center; background: var(--red); color: #fff; border-radius: 26px; height: 46px; overflow: hidden; flex: none; }
  .step button { border: 0; background: none; color: #fff; width: 40px; height: 46px; font-size: 22px; font-weight: 600; }
  .step button:hover { background: rgba(0,0,0,.12); }
  .step span { min-width: 22px; text-align: center; font-weight: 700; font-size: 17px; }
  .step.sm { height: 36px; } .step.sm button { height: 36px; width: 32px; font-size: 18px; } .step.sm span { font-size: 15px; }

  /* ---------- Recettes ---------- */
  .rgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .rcard { background: var(--card); border-radius: var(--radius); overflow: hidden; cursor: pointer; display: flex; flex-direction: column; transition: box-shadow .15s; }
  .rcard:hover { box-shadow: 0 4px 18px rgba(0,0,0,.1); }
  .rart { height: 150px; display: grid; place-items: center; font-size: 70px; position: relative; }
  .rart .loc { position: absolute; left: 12px; top: 12px; }
  .rbody { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .rbody h3 { font-size: 23px; line-height: 1.05; }
  .rmeta { display: flex; gap: 12px; color: var(--muted); font-size: 14px; flex-wrap: wrap; }
  .rtags { display: flex; gap: 6px; flex-wrap: wrap; }
  .rfoot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding-top: 6px; }
  .rfoot b { font-size: 15px; }
  .hint { display: flex; gap: 14px; align-items: center; background: #e6f1fa; color: var(--sea); border-radius: 14px; padding: 14px 18px; margin-bottom: 18px; }
  .hint .t { flex: 1; }

  /* ---------- Fiche produit ---------- */
  .crumb { font-size: 15px; margin-bottom: 14px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .crumb a { cursor: pointer; text-decoration: underline; }
  .crumb b { font-weight: 600; }
  .pd { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .pd .big { background: #fff; border-radius: var(--radius); height: 560px; display: grid; place-items: center; position: relative; }
  .pd .big .art { width: 70%; height: 70%; border-radius: 24px; display: grid; place-items: center; font-size: 200px; }
  .pd .col { display: flex; flex-direction: column; gap: 12px; }
  .pd .info { background: #fff; border-radius: var(--radius); padding: 22px 24px; position: relative; }
  .pd .info .brand { font-weight: 700; font-size: 21px; }
  .pd .info .nm { font-size: 19px; margin-top: 2px; }
  .pd .info .unit { color: var(--muted); }
  .ns { display: inline-flex; flex-direction: column; gap: 2px; margin-top: 14px; }
  .ns small { font-size: 9px; font-weight: 700; letter-spacing: .5px; color: #555; }
  .ns .row { display: flex; align-items: center; background: #ddd; border-radius: 6px; padding: 2px; }
  .ns .row span { width: 18px; height: 26px; display: grid; place-items: center; font-weight: 800; color: rgba(255,255,255,.65); font-size: 14px; }
  .ns .row span.on { width: 28px; height: 34px; border-radius: 50%; color: #fff; font-size: 20px; border: 2px solid #fff; margin: -4px 0; }
  .pd .buy { background: #fff; border-radius: var(--radius); padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; }
  .pd .buy .price { font-size: 38px; }
  .acc { background: #fff; border-radius: var(--radius); padding: 18px 24px; font-size: 19px; display: flex; justify-content: space-between; cursor: pointer; }
  .riskbox { border: 1.5px solid var(--warn-line); background: var(--warn-bg); border-radius: 12px; padding: 12px 14px; color: #5a3200; font-size: 14px; display: flex; gap: 10px; }
  .riskbox .ic { font-size: 20px; line-height: 1; }
  .localbox { border: 1.5px solid #b9d6ef; background: #eef6fd; border-radius: 12px; padding: 12px 14px; color: var(--sea); font-size: 14px; display: flex; gap: 10px; }

  /* ---------- Listes rayon ---------- */
  .lhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
  .lhead select { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; }
  .subchips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }

  /* ---------- Méga-menu Rayons ---------- */
  .mm-bg { position: fixed; inset: 92px 0 0 0; background: rgba(0,0,0,.45); z-index: 35; display: none; }
  .mm-bg.on { display: block; }
  .mm { position: fixed; top: 92px; left: 0; bottom: 0; z-index: 36; display: none; background: #fff; box-shadow: 4px 0 24px rgba(0,0,0,.15); }
  .mm.on { display: flex; }
  .mm .c1 { width: 380px; overflow-y: auto; padding: 26px 18px 30px 22px; border-right: 1px solid var(--line); }
  .mm .c2 { width: 420px; overflow-y: auto; padding: 30px 26px; }
  .mm h3 { font-size: 24px; margin: 6px 0 14px; }
  .mm .it { display: flex; align-items: center; gap: 16px; width: 100%; border: 0; background: none; text-align: left; padding: 10px 12px; border-radius: 8px; font-size: 19px; }
  .mm .it .e { width: 34px; font-size: 24px; text-align: center; }
  .mm .it .chev { margin-left: auto; opacity: .6; }
  .mm .it:hover, .mm .it.on { background: var(--red); color: #fff; }
  .mm .it.hl span.t { background: linear-gradient(transparent 55%, var(--yellow) 55%); font-weight: 700; }
  .mm .it.hl:hover span.t { background: none; }
  .mm .c2 .it { font-size: 18px; padding: 12px 14px; }
  .mm .c2 .all { color: var(--red); background: none; border: 0; padding: 0; font-size: 17px; margin-bottom: 14px; }

  /* ---------- Tiroirs ---------- */
  .dr-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .dr-bg.on { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 540px; max-width: 100vw; background: #fff; z-index: 61; transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column; }
  .drawer.on { transform: none; }
  .drawer .dh { display: flex; align-items: center; justify-content: space-between; padding: 22px 28px; border-bottom: 1px solid var(--line); }
  .drawer .dh h3 { font-size: 26px; }
  .xbtn { border: 0; background: none; font-size: 30px; line-height: 1; padding: 4px 8px; }
  .drawer .db { flex: 1; overflow-y: auto; padding: 18px 24px; }
  .drawer .df { border-top: 1px solid var(--line); padding: 16px 24px 20px; }
  .empty { text-align: center; padding: 40px 20px; }
  .empty .basket { font-size: 110px; }
  .empty h2 { font-size: 38px; margin: 10px 0; }
  .citem { border-bottom: 1px solid var(--line); padding: 14px 0; }
  .citem .row { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; }
  .thumb { width: 64px; height: 64px; border-radius: 10px; display: grid; place-items: center; font-size: 34px; }
  .thumb.sm { width: 44px; height: 44px; font-size: 24px; border-radius: 8px; }
  .citem .nm { font-weight: 600; line-height: 1.2; }
  .citem .sub { color: var(--muted); font-size: 13px; }
  .citem .pr { font-weight: 700; margin-top: 2px; }
  .subbox { margin-top: 10px; border: 1.5px solid var(--warn-line); background: var(--warn-bg); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .subbox.accepted { border-color: #a9dcb7; background: #f0faf3; }
  .subbox.refused { border-color: var(--line); background: #f7f7f8; }
  .subbox .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .subbox .top .t { font-weight: 700; color: var(--warn); }
  .subbox.accepted .top .t { color: var(--green-2); }
  .subbox.refused .top .t { color: var(--muted); }
  .subbox ol { margin: 8px 0 8px; padding-left: 0; list-style: none; counter-reset: s; }
  .subbox li { counter-increment: s; display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  .subbox li::before { content: counter(s); width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 1.5px solid currentColor; font-size: 11px; font-weight: 700; display: grid; place-items: center; flex: none; color: var(--muted); }
  .subbox li .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .subbox li .d { font-weight: 600; font-size: 13px; color: var(--muted); }
  .subbox .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .subbox .acts .btn { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
  .tot { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .tot .v { font: 700 30px/1 "Barlow Condensed", sans-serif; }
  .pending-note { background: var(--warn-bg); color: #5a3200; border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }

  /* Tiroir compte */

  if (has('apero') && (['chips', 'olives', 'biere', 'vin', 'nicoise', 'anchois'].includes(p.g))) s += 12;
  if (has('petitdej') && ['lait', 'jus', 'confit', 'tartiner', 'beurre', 'pain', 'biscuit'].includes(p.g)) s += 12;
  if (pr.budget === 'petit') { if (p.mdd) s += 10; if (PROMO[p.id]) s += 8; }
  if (pr.budget === 'premium') { if (p.bio || p.loc) s += 6; if (p.ns === 'A') s += 3; }
  if (pr.marques === 'mdd' && p.mdd) s += 10;

function subScore(o, c) {
  const pr = state.profile; const rel = (c.p - o.p) / o.p; let s = 50;
  s -= Math.abs(rel) * 25;
  if (c.b === o.b) s += 10;
  if (pr.budget === 'petit') { s -= rel * 40; if (c.mdd) s += 10; }
  if (pr.budget === 'premium') { s += rel * 20; if (c.bio || c.loc) s += 8; }
  if (pr.marques === 'mdd' && c.mdd) s += 18;
  if (pr.marques === 'marques' && !c.mdd) s += 18;
  if (has('bio') && c.bio) s += 22;
  if (has('local') && c.loc) s += 22;
  if (o.bio && c.bio) s += 8;
  if (o.loc && c.loc) s += 8;
  s -= c.r * 0.6;
  return s;
}

  if (c.mdd && (state.profile.budget === 'petit' || state.profile.marques === 'mdd')) out.push(['Marque Intermarché', 'mdd']);

  return out.slice(0, 2);
}
// Choisit, dans le groupe du produit de la recette, la référence la plus adaptée au profil
function pickForProfile(pid) {
  const o = P[pid];
  const pool = PRODUCTS.filter(c => c.g === o.g && allowed(c));
  if (!pool.length) return pid;
  return pool.map(c => [c, subScore(o, c) + (c.id === pid ? 15 : 0)]).sort((a, b) => b[1] - a[1])[0][0].id;
}
function recipeLines(r, portions, have) {
  const k = portions / r.base;
  return r.ing.map((ing, i) => {
    const q = ing.q * k;
    const line = { i, ing, qtyTxt: fmtQty(q, ing.u, ing.n), pantry: !!ing.pantry, have: have ? have[i] : (ing.have || ing.pantry) };
    if (!ing.pantry) {
      line.pid = pickForProfile(ing.pid);
      line.swapped = line.pid !== ing.pid;
      line.units = Math.max(1, Math.ceil(q / ing.pack - 1e-9));
    }
    return line;
  });
}
function recipeCost(r, portions, have) {
  const lines = recipeLines(r, portions, have);
  const buy = lines.filter(l => !l.pantry && !l.have);
  return { lines, buy, total: buy.reduce((s, l) => s + P[l.pid].p * l.units, 0) };
}
function fmtQty(q, u, n) {
  let v = q;
  if (u === 'g' && v >= 1000) return `${String(Math.round(v / 100) / 10).replace('.', ',')} kg de ${n}`;
  if (u === 'g') v = Math.round(v / 10) * 10;
  else if (u === 'cl' || u === 'kg') v = Math.round(v * 10) / 10;
  else v = Math.max(1, Math.round(v));
  const vs = String(v).replace('.', ',');
  if (!u) return `${vs} ${n}`;
  const de = /^[aeiouyhœéèê]/i.test(n) ? 'd’' : 'de ';
  if (n.startsWith('d’')) return `${vs} ${u} ${n}`;
  return `${vs} ${u} ${de}${n}`;
}

function add(pid, n = 1, silent = false) {
  const isNew = !state.cart[pid];
  state.cart[pid] = (state.cart[pid] || 0) + n;
  let created = false;
  if (isNew && P[pid].r >= RUPT && !state.subs[pid]) {
    state.subs[pid] = { status: 'pending', list: rankSubs(pid).slice(0, 3) };
    created = true;
  }
  update();
  if (!silent) {
    if (created) openSubProposal(pid);
    else toast(`✓ ${esc(P[pid].n)} ajouté au panier`);
  }
  return created;
}
function setQty(pid, q) {
  if (q <= 0) { delete state.cart[pid]; delete state.subs[pid]; }
  else state.cart[pid] = q;
  update();
}
function setSubStatus(pid, status) {
  state.subs[pid].status = status;
  if (status === 'accepted') state.subs[pid].user = [...state.subs[pid].list];
  closeModal(); update();
  toast(status === 'accepted' ? '✓ Remplacements validés : le préparateur suivra votre ordre de préférence'
    : '✓ Noté : ce produit ne sera pas remplacé s’il est indisponible');
}
function removeSub(pid, sid) {

function stepper(id, q, cls = '') {

}
function card(p, why) {
  const q = state.cart[p.id] || 0;
  const rem = PROMO[p.id] && PROMO[p.id].startsWith('-') ? `<span class="remise">${PROMO[p.id]}<small>REMISE<br>IMMÉDIATE</small></span>` : '';
  return `<div class="pcard" onclick="go('product',{pid:'${p.id}'})">
    <div class="ptop">${badges(p)}</div>
    <button class="fav ${state.favs.has(p.id) ? 'on' : ''}" onclick="event.stopPropagation();toggleFav('${p.id}')" aria-label="Favori">${IC.heart}</button>
    <div class="pimg" style="background:${BG[p.cat]}">${p.e}${rem}</div>
    ${why ? `<div class="why">${why}</div>` : ''}
    <div class="pbrand">${esc(brandLine(p))}</div>
    <div class="pname">${esc(p.n)}</div>
    <div class="punit">${esc(p.u)} · ${p.k}</div>
    <div class="pbot"><div class="price">${fmt(p.p)}</div>${q ? stepper(p.id, q) : `<button class="addbtn" onclick="event.stopPropagation();add('${p.id}')" aria-label="Ajouter au panier">${IC.cartplus}</button>`}</div>
  </div>`;
}
let carN = 0;
function carousel(items) {
  const id = 'car' + (carN++);
  return `<div class="car"><button class="cnav l" onclick="scrollCar('${id}',-1)">‹</button><button class="cnav r" onclick="scrollCar('${id}',1)">›</button>
    <div class="crow" id="${id}">${items.join('')}</div></div>`;
}
function scrollCar(id, d) { const el = $(id); el.scrollBy({ left: d * el.clientWidth * 0.8, behavior: 'smooth' }); }
function toggleFav(id) { state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id); render(); }

function viewList() {
  const { cat, sub } = state;
  let title, items, crumbs = [];
  if (cat === 'promo') { title = 'Toutes nos promotions'; items = PRODUCTS.filter(p => PROMO[p.id]); }
  else if (cat === 'nice') { title = 'Spécialités de Nice & produits locaux'; items = PRODUCTS.filter(p => p.loc); }
  else if (cat === 'nouv') { title = 'Nouveautés de votre magasin'; items = PRODUCTS.filter(p => p.nw); }
  else if (cat === 'favs') { title = 'Mes produits'; items = PRODUCTS.filter(p => state.favs.has(p.id)); }
  else {
    const c = CATS.find(x => x.id === cat); title = sub || c.n;
    crumbs = sub ? [[c.n, `go('list',{cat:'${cat}'})`]] : [];
    items = PRODUCTS.filter(p => p.cat === cat && (!sub || p.sub === sub));
  }
  const hidden = items.filter(p => !allowed(p)).length;
  items = items.filter(allowed);
  items = state.sort === 'prix' ? items.sort((a, b) => a.p - b.p) : items.sort((a, b) => prodScore(b) - prodScore(a));
  const subs = CATS.find(x => x.id === cat) ? [...new Set(PRODUCTS.filter(p => p.cat === cat).map(p => p.sub))] : [];
  return `<div class="crumb">🏠 / ${crumbs.map(([t, a]) => `<a onclick="${a}">${t}</a> / `).join('')}<b>${esc(title)}</b></div>
    <div class="lhead"><div><h1>${esc(title)}</h1><div class="muted">${items.length} produits${hidden ? ` · ${hidden} masqué${hidden > 1 ? 's' : ''} selon vos préférences (${state.profile.prefs.filter(k => ['veg', 'sansporc', 'sansgluten', 'sanslactose'].includes(k)).map(k => label(PREFS, k).replace(/^\S+\s/, '')).join(', ')})` : ''}</div></div>
      <label>Trier par <select onchange="state.sort=this.value;render()"><option value="profil" ${state.sort === 'profil' ? 'selected' : ''}>Pertinence pour mon profil</option><option value="prix" ${state.sort === 'prix' ? 'selected' : ''}>Prix croissant</option></select></label></div>

    ${items.length ? `<div class="grid">${items.map(p => card(p)).join('')}</div>` : `<div class="panel muted">Aucun produit ici pour le moment.</div>`}`;
}

function rebuy(no) {

  ORDERS.find(o => o.no === no).items.forEach(id => { if (allowed(P[id]) && !state.cart[id]) { if (add(id, 1, true)) created++; } });
  toast(`✓ Commande ajoutée au panier${created ? ` · ${created} remplacements proposés` : ''}`);
  if (created) setTimeout(openCart, 400);
}

function insights() {
  const all = ORDERS.flatMap(o => o.items).map(id => P[id]);
  const pct = f => Math.round(all.filter(f).length / all.length * 100);
  const byCat = CATS.map(c => [c.n, all.filter(p => p.cat === c.id).length]).sort((a, b) => b[1] - a[1]);
  const max = byCat[0][1];
  const avg = ORDERS.reduce((s, o) => s + o.total, 0) / ORDERS.length;
  return { n: all.length, mdd: pct(p => p.mdd), loc: pct(p => p.loc), bio: pct(p => p.bio), avg, byCat, max,
    prep: pct(p => p.cat === 'boul' && p.sub === 'Spécialités niçoises') };
}
// Les 3 critères principaux : le foyer puis les préférences dans l'ordre où elles ont été choisies
// (le budget complète s'il y a moins de 2 préférences). Les autres critères sont listés en dessous, sans mise en avant.
const PREF_DESC = {
  local: 'Spécialités niçoises et producteurs de la région mis en avant.', maison: 'Produits bruts et recettes à cuisiner soi-même.',
  bio: 'Produits bio proposés en priorité.', rapide: 'Recettes de 30 min max et produits pratiques.',
  healthy: 'Produits bien notés au Nutri-Score et recettes équilibrées.', proteine: 'Viandes, poissons, œufs et légumineuses en avant.',
  sucre: 'Moins de produits sucrés dans vos suggestions.', flexi: 'Moins de viande dans vos suggestions et vos recettes.',
  antigaspi: 'Petits prix, promotions et marques Intermarché en avant.', enfants: 'Yaourts, goûters, fruits et formats familiaux.',
  apero: 'Olives, chips, socca, vins et bières locales.', petitdej: 'Lait, jus, confitures, pain et viennoiseries.',
  veg: 'Viandes et poissons ne vous sont plus proposés.', sansporc: 'Produits à base de porc masqués.',
  sansgluten: 'Produits avec gluten masqués.', sanslactose: 'Produits avec lactose masqués.',
};
function mainCriteria() {
  const pr = state.profile, D = DERIVED, I = insights();
  const ev = {
    local: 'Olives de Nice, blettes, huile d’olive AOP et pissaladière reviennent dans vos achats.',
    maison: 'Beaucoup de produits bruts dans vos achats, très peu de plats préparés.',
  };
  const foyer = { ic: { solo: '🧍', couple: '👫', famille: '👨‍👩‍👧‍👦', coloc: '🏠', senior: '👵' }[pr.foyer], t: `${label(FOYERS, pr.foyer)} · ${pr.personnes} pers.`,
    d: pr.foyer === D.foyer && pr.personnes === D.personnes ? '6 L de lait, 12 œufs et ~1 kg de viande par commande.' : 'Recettes et formats adaptés à votre foyer.' };
  const prefs = pr.prefs.map(k => ({ ic: label(PREFS, k).split(' ')[0], t: label(PREFS, k).replace(/^\S+\s/, ''), d: (D.prefs.includes(k) && ev[k]) || PREF_DESC[k] }));
  const budget = { ic: '💶', t: `Budget ${label(BUDGETS, pr.budget).toLowerCase()}`,
    d: pr.budget === D.budget ? `Panier moyen de ${I.avg.toFixed(0)} €, ${I.mdd} % de marques Intermarché.` : BUDGETS.find(b => b[0] === pr.budget)[2] + '.' };
  const main = [foyer, ...prefs.slice(0, 2)];
  if (main.length < 3) main.push(budget);
  const others = [...prefs.slice(2).map(p => p.t), ...(main.includes(budget) ? [] : [budget.t]), label(MARQUES, pr.marques), `Cuisine : ${label(TEMPS, pr.temps).toLowerCase()}`];
  return { main, others };
}

        ${isCustom() ? `<div style="margin-top:8px"><button class="link" onclick="resetProfile()">Revenir au profil déduit de mes achats</button></div>` : ''}</div>
    </div>
    <div class="grid2" style="margin-top:20px">
      <div>
        <div class="panel">
          <h3>Votre profil en 3 critères</h3>
          <p class="muted" style="margin:4px 0 0;font-size:14px">Les critères qui comptent le plus dans vos suggestions.</p>
          ${traits()}
        </div>
        <div class="panel">
          <h3>Vos achats en chiffres</h3>
          <p class="muted" style="margin:4px 0 0;font-size:14px">Calculé sur vos ${ORDERS.length} dernières commandes drive (du ${ORDERS[ORDERS.length - 1].date} au ${ORDERS[0].date}), soit ${I.n} articles.</p>
          <div class="kpis"><div class="kpi"><b>${I.avg.toFixed(0)} €</b><span>dépensés en moyenne par commande</span></div><div class="kpi"><b>${I.mdd} %</b><span>des articles sont des marques Intermarché</span></div>
            <div class="kpi"><b>${I.loc} %</b><span>des articles sont des produits locaux</span></div><div class="kpi"><b>${I.bio} %</b><span>des articles sont bio</span></div></div>
          <div style="font-weight:700;margin-top:14px">Articles achetés par rayon</div>
          <div class="bars">${I.byCat.map(([n, v]) => `<div class="bar"><span>${n}</span><div class="tr"><i style="width:${v / I.max * 100}%"></i></div><span class="v">${v}</span></div>`).join('')}</div>
        </div>
        <div class="panel">
          <h3>Ce que votre profil change, en direct</h3>
          <div class="preview"><div style="font-weight:700;margin-bottom:4px">🔄 Si la viande hachée Jean Rozé manque :</div>
            ${demoSubs.length ? demoSubs.map((id, i) => `<div class="pi"><span class="num" style="width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700">${i + 1}</span><span class="n">${P[id].e} ${esc(P[id].b)} — ${esc(P[id].n)}</span>${deltaHtml(demo, id)}</div>`).join('') : '<div class="muted">Aucun remplacement compatible (profil végétarien) : la viande ne vous est plus proposée.</div>'}</div>
          <div class="preview"><div style="font-weight:700;margin-bottom:4px">🍲 Vos recettes en tête de liste :</div>
            ${recs.map(r => `<div class="pi"><span>${r.e}</span><span class="n">${esc(r.n)}</span><span class="muted">${r.t} min</span></div>`).join('')}</div>
        </div>
      </div>
      <div class="panel">
        <div class="fgroup"><div class="fl">Mon foyer</div><div class="fd">Pour adapter les formats (familial, portions individuelles…)</div>
          <div class="chips">${FOYERS.map(([k, t]) => `<button class="chip ${pr.foyer === k ? 'on' : ''}" onclick="setProf('foyer','${k}')">${t}</button>`).join('')}</div></div>
        <div class="fgroup"><div class="fl">Nombre de personnes</div><div class="fd">Utilisé pour les quantités des recettes</div>
          <div class="people"><div class="step sm"><button onclick="setProf('personnes',${Math.max(1, pr.personnes - 1)})">−</button><span>${pr.personnes}</span><button onclick="setProf('personnes',${Math.min(12, pr.personnes + 1)})">+</button></div>
          <span class="ico">${'👤'.repeat(Math.min(pr.personnes, 8))}</span></div></div>
        <div class="fgroup"><div class="fl">Mes préférences de consommation</div><div class="fd">Plusieurs choix possibles. Les régimes et exclusions masquent les produits non compatibles.</div>
          ${PREF_GROUPS.map(([g, items]) => `<div class="pgl">${g}</div><div class="chips">${items.map(([k, t]) => `<button class="chip ${has(k) ? 'on' : ''}" onclick="togglePref('${k}')">${t}</button>`).join('')}</div>`).join('')}</div>
        <div class="fgroup"><div class="fl">Mon budget</div><div class="fd">Oriente les recommandations et l’ordre des remplacements</div>${seg(BUDGETS, 'budget')}</div>
        <div class="fgroup"><div class="fl">Mes marques</div><div class="fd">&nbsp;</div>${seg(MARQUES, 'marques')}</div>
        <div class="fgroup"><div class="fl">Mon temps de cuisine</div><div class="fd">Pour vous proposer des recettes réalistes</div>${seg(TEMPS, 'temps')}</div>
        <div class="uses"><div><b>🛒 Recommandations</b>Accueil, rayons et recherche triés pour vous</div><div><b>🔄 Remplacements</b>Proposés à l’ajout au panier, classés pour vous</div><div><b>🍲 Recettes</b>Adaptées à vos goûts et votre foyer</div></div>
      </div>
    </div>`;
}
function profileChanged() { refreshPendingSubs(); update(); toast('✓ Profil mis à jour — recommandations, remplacements et recettes recalculés', 2200); }
function setProf(k, v) { state.profile[k] = v; profileChanged(); }
function togglePref(k) {
  const p = state.profile.prefs;
  if (p.includes(k)) p.splice(p.indexOf(k), 1);
  else { p.push(k); if (k === 'veg') { const i = p.indexOf('flexi'); if (i >= 0) p.splice(i, 1); } if (k === 'flexi') { const i = p.indexOf('veg'); if (i >= 0) p.splice(i, 1); } }
  // l'ordre de choix est conservé : les premières préférences sont les critères principaux
  profileChanged();
}
function resetProfile() { state.profile = JSON.parse(JSON.stringify(DERIVED)); profileChanged(); }

/* ---------- Validation du panier ---------- */
const SLOTS = [['🏪', 'Retrait au drive', 'Samedi 17 octobre · 08h00 - 12h00', 0], ['🚚', 'Livraison à domicile', 'Samedi 17 octobre · 10h00 - 12h00', 0], ['🚶', 'Retrait piéton', 'Vendredi 16 octobre · 16h00 - 17h00', 0]];
function viewCheckout() {
  if (state.done) return `<div class="panel success"><div class="big">✅</div><h1>Commande N°${state.done.no} confirmée</h1>
    <p style="font-size:18px">${SLOTS[state.done.slot][1]} — ${SLOTS[state.done.slot][2]}<br>${esc(STORE.name)}</p>
    <p class="muted">${state.done.subs} consigne${state.done.subs > 1 ? 's' : ''} de remplacement transmise${state.done.subs > 1 ? 's' : ''} au préparateur. Vous ne payez que les produits réellement préparés.</p>
    <button class="btn red" onclick="state.done=null;go('home')">Retour à l’accueil</button></div>`;
  const ids = Object.keys(state.cart);
  if (!ids.length) return `<div class="panel"><h1>Mon panier</h1><p class="muted">Votre panier est vide.</p><button class="btn red" onclick="go('home')">Continuer mes courses</button></div>`;
  const risky = ids.filter(id => state.subs[id]);
  const pending = risky.filter(id => state.subs[id].status === 'pending').length;
  return `<div class="crumb">🏠 / <b>Valider mon panier</b></div><h1 style="margin-bottom:16px">Valider mon panier</h1>
    <div class="co"><div>
      ${risky.length ? `<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h3>🔄 Remplacements en cas d’indisponibilité</h3><p class="muted" style="margin:4px 0 0">Vérifiez vos consignes : elles seront suivies par le préparateur si le produit manque en magasin.</p></div>
        ${pending ? `<button class="btn sm green" onclick="acceptAllPending()">Tout accepter (${pending})</button>` : ''}</div>
        ${risky.map(id => `<div class="citem"><div class="row"><div class="thumb" style="background:${BG[P[id].cat]}">${P[id].e}</div><div><div class="nm">${esc(P[id].b)} — ${esc(P[id].n)}</div><div class="sub">Quantité : ${state.cart[id]}</div></div><div class="pr">${fmt(P[id].p * state.cart[id])}</div></div>${subBox(id)}</div>`).join('')}</div>` : ''}
      <div class="panel" style="margin-top:20px"><h3>Mes produits (${cartCount()})</h3>
        ${ids.filter(id => !state.subs[id]).map(id => `<div class="citem"><div class="row"><div class="thumb" style="background:${BG[P[id].cat]}">${P[id].e}</div><div><div class="nm">${esc(P[id].b)} — ${esc(P[id].n)}</div><div class="sub">${esc(P[id].u)}</div></div>${stepper(id, state.cart[id], 'sm')}</div></div>`).join('')}
      </div></div>
      <div class="side2">
        <div class="panel"><h3 style="margin-bottom:12px">Mon créneau</h3>${SLOTS.map(([ic, t, d], i) => `<button class="slot ${state.slot === i ? 'on' : ''}" onclick="state.slot=${i};render()"><span class="ic">${ic}</span><span><b>${t}</b>${d}</span></button>`).join('')}</div>
        <div class="prep"><h3>📋 Consignes pour le préparateur</h3>
          ${risky.length ? risky.map(id => { const s = state.subs[id]; return `<div class="l">${esc(P[id].n)} → ${s.status === 'refused' || !s.list.length ? '<b>ne pas remplacer</b>' : s.list.map((x, i) => `<b>${i + 1}.</b> ${esc(P[x].b)} ${esc(P[x].n)}`).join(' · ')}${s.status === 'pending' ? ' <span style="opacity:.6">(proposé)</span>' : ''}</div>`; }).join('') : '<div class="l">Aucune consigne de remplacement.</div>'}</div>
        <div class="panel"><div class="tot"><span style="font-size:18px">Total estimé</span><span class="v">${fmt(cartTotal())}</span></div>
          <div class="muted" style="font-size:13px;margin-bottom:12px">Frais de livraison offerts sur votre 1<sup>re</sup> commande.</div>
          ${pending ? `<div class="pending-note"><span>${pending} remplacement${pending > 1 ? 's' : ''} encore à confirmer : ${pending > 1 ? 'ils seront appliqués' : 'il sera appliqué'} tel${pending > 1 ? 's' : ''} que proposé${pending > 1 ? 's' : ''}.</span></div>` : ''}
          <button class="btn red" style="width:100%" onclick="placeOrder()">Valider ma commande</button></div>
      </div></div>`;
}
function placeOrder() {
  const n = Object.values(state.subs).filter(s => s.status !== 'refused' && s.list.length).length;
  state.done = { no: '8261' + Math.floor(10000 + Math.random() * 89999), slot: state.slot, subs: n };
  state.cart = {}; state.subs = {}; update(); window.scrollTo(0, 0);
}

/* =====================================================================
   ROUTAGE / RENDU
   ===================================================================== */
const VIEWS = { home: viewHome, list: viewList, search: viewSearch, product: viewProduct, recipes: viewRecipes, compte: viewCompte, checkout: viewCheckout };
function go(view, params = {}) {
  Object.assign(state, { view, sub: null }, params);
  if (view !== 'search') $('q').value = '';
  toggleMenu(false); render(); window.scrollTo(0, 0);
}
function render() {
  carN = 0;
  $('main').innerHTML = VIEWS[state.view]();
  $('nav-rec').classList.toggle('on', state.view === 'recipes');
  $('nav-acc').classList.toggle('on', state.view === 'compte');
}
function update() {
  const n = cartCount(); $('cartCount').hidden = !n; $('cartCount').textContent = n;
  // garder la position des carrousels
  const pos = [...document.querySelectorAll('.crow')].map(el => el.scrollLeft);
  render();
  document.querySelectorAll('.crow').forEach((el, i) => { if (pos[i]) el.scrollLeft = pos[i]; });
  if ($('cartDr').classList.contains('on')) renderCart();
}

/* ---------- Bandeau magasin ---------- */
let bIdx = 0;
function renderStoreBar() {
  const m = STORE_BANNER[bIdx];
  $('storebar').innerHTML = `<div class="wrap">
    <div class="who"><span class="dot">☀️</span><span>Votre magasin<small>${esc(STORE.short)}</small></span></div>
    <div class="msg" id="sbMsg"><span class="ic">${m.ic}</span><span>${m.html}</span></div>
    <div class="dots">${STORE_BANNER.map((_, i) => `<button class="${i === bIdx ? 'on' : ''}" onclick="bIdx=${i};renderStoreBar()" aria-label="Message ${i + 1}"></button>`).join('')}</div>
    <button class="insta" onclick="toast('Démo : ouverture du compte Instagram ${STORE.instagram}')"><span class="ig">${IC.insta}</span>${STORE.instagram}</button>
  </div>`;
}
setInterval(() => {
  const el = $('sbMsg'); if (!el) return;
  el.classList.add('fade');
  setTimeout(() => { bIdx = (bIdx + 1) % STORE_BANNER.length; renderStoreBar(); }, 350);
}, 6000);

renderStoreBar();
render();
</script>
</body>
</html>
